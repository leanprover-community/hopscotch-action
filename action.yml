name: 'hopscotch'
description: >
  Identify upstream breaking commits (bisect) and/or open a bump PR to keep a
  Lean 4 downstream pinned to the latest passing revision. Works with any
  GitHub-hosted Lean dependency — not tied to mathlib4.

branding:
  icon: search
  color: orange

inputs:
  # ---- Core hopscotch arguments ----------------------------------------
  dependency:
    description: 'The lakefile require name, e.g. "mathlib" or "batteries".'
    required: true
  from:
    description: >
      Exclusive lower bound for the bisect range. Defaults to the current rev
      in lake-manifest.json for the named dependency.
    required: false
    default: ''
  to:
    description: >
      Inclusive upper bound. Defaults to the upstream default-branch HEAD
      (resolved automatically by hopscotch when omitted).
    required: false
    default: ''
  project-dir:
    description: 'Path to the Lean project root. Defaults to the repository root.'
    required: false
    default: '.'
  extra-args:
    description: >
      Additional arguments passed verbatim to `hopscotch dep`. Accepts single-
      or multi-line input; each line is word-split on whitespace, so you can
      group related flags across lines:
        extra-args: |
          --scan-mode linear
          --allow-dirty-workspace
    required: false
    default: ''

  # ---- Action behaviour -------------------------------------------------
  hopscotch-version:
    description: >
      hopscotch release tag (e.g. "v1.4.0") or "latest" to resolve the newest
      release automatically. Pinning to a specific version is recommended for
      reproducibility.
    required: false
    default: 'v1.4.0'
  max-window-size:
    description: >
      Abort if the commit range contains more than this many commits. Guards
      against runaway runs on ancient pins. Raise or remove if you intentionally
      need a large window.
    required: false
    default: '3000'

  # ---- Bump PR ----------------------------------------------------------
  open-pr:
    description: 'Open or update a bump PR when the manifest pin changes.'
    required: false
    default: 'true'
  pr-branch:
    description: 'Branch name for the bump PR (force-pushed on each run).'
    required: false
    default: 'hopscotch/bump'
  pr-base:
    description: 'Base branch for the bump PR. Defaults to the repository default branch.'
    required: false
    default: ''
  pr-labels:
    description: 'Comma-separated list of labels to apply to the bump PR.'
    required: false
    default: ''
  reviewers:
    description: >
      Comma-separated list of GitHub usernames or team slugs to request review
      from on the bump PR (passed to `gh pr create --reviewer`).
    required: false
    default: ''

  # ---- Tracking issue ---------------------------------------------------
  open-issue:
    description: >
      Open a GitHub issue when a culprit is found; update it on subsequent
      failures; close it automatically when the downstream recovers.
    required: false
    default: 'true'
  issue-labels:
    description: 'Comma-separated list of labels to apply to the tracking issue.'
    required: false
    default: ''

  # ---- Auth -------------------------------------------------------------
  github-token:
    description: >
      GitHub token for API calls and gh CLI operations (PR, issue, release
      resolution). Defaults to the job token.
    required: false
    default: ${{ github.token }}

outputs:
  outcome:
    description: '"passed" | "incompatible" | "skipped" | "tool-error"'
    value: ${{ steps.parse.outputs.outcome }}
  culprit-commit:
    description: 'SHA of the first failing upstream commit (non-empty when outcome=incompatible).'
    value: ${{ steps.parse.outputs.culprit_commit }}
  last-good-commit:
    description: 'SHA of the last passing upstream commit.'
    value: ${{ steps.parse.outputs.last_good_commit }}
  target-commit:
    description: 'SHA that the --to ref resolved to.'
    value: ${{ steps.parse.outputs.target_commit }}
  previous-pin:
    description: 'The dependency rev in lake-manifest.json before this run.'
    value: ${{ steps.read-pin.outputs.previous_pin }}
  new-pin:
    description: 'The dependency rev in lake-manifest.json after this run.'
    value: ${{ steps.parse.outputs.new_pin }}
  pr-number:
    description: 'Bump PR number (empty when no PR was opened).'
    value: ${{ steps.resolve-outputs.outputs.pr_number }}
  pr-url:
    description: 'Bump PR URL (empty when no PR was opened).'
    value: ${{ steps.resolve-outputs.outputs.pr_url }}
  pr-action:
    description: '"created", "updated", or "none".'
    value: ${{ steps.resolve-outputs.outputs.action }}
  issue-number:
    description: 'Tracking issue number (empty when not opened).'
    value: ${{ steps.issue.outputs.issue_number }}
  issue-url:
    description: 'Tracking issue URL (empty when not opened).'
    value: ${{ steps.issue.outputs.issue_url }}
  summary-md:
    description: 'Markdown summary from .lake/hopscotch/summary.md.'
    value: ${{ steps.parse.outputs.summary_md }}

runs:
  using: composite
  steps:
    # Stage 1 — install elan + hopscotch binary and add both to PATH.
    - name: Install hopscotch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HOPSCOTCH_VERSION: ${{ inputs.hopscotch-version }}
      run: ${{ github.action_path }}/scripts/install-hopscotch.sh

    # Stage 2 — read the current dep rev from lake-manifest.json.
    - name: Read current pin
      id: read-pin
      shell: bash
      env:
        DEP_NAME: ${{ inputs.dependency }}
        FROM_INPUT: ${{ inputs.from }}
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: ${{ github.action_path }}/scripts/read-pin.sh

    # Stage 3 — run hopscotch (clean stale session + invoke `hopscotch dep`).
    # With --keep-last-good, hopscotch itself probes the upper endpoint first
    # and terminates cleanly (status=completed) if it passes — so no separate
    # pre-probe is needed.
    - name: Run hopscotch
      id: run
      shell: bash
      env:
        DEP_NAME: ${{ inputs.dependency }}
        FROM_REF: ${{ steps.read-pin.outputs.resolved_from }}
        TO_REF: ${{ inputs.to }}
        PROJECT_DIR: ${{ inputs.project-dir }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/scripts/run-hopscotch.sh

    # Stage 4 — parse .lake/hopscotch/results.json (public, schemaVersion-1
    # output) into structured step outputs.
    - name: Parse hopscotch results
      id: parse
      shell: bash
      env:
        DEP_NAME: ${{ inputs.dependency }}
        PROJECT_DIR: ${{ inputs.project-dir }}
        PREVIOUS_PIN: ${{ steps.read-pin.outputs.previous_pin }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        MAX_WINDOW: ${{ inputs.max-window-size }}
      run: ${{ github.action_path }}/scripts/parse-results.sh

    # Stage 5 — compute the "should we attempt a PR?" boolean once.
    - name: Decide whether to open PR
      id: should-open-pr
      shell: bash
      env:
        OUTCOME: ${{ steps.parse.outputs.outcome }}
        NEW_PIN: ${{ steps.parse.outputs.new_pin }}
        PREVIOUS_PIN: ${{ steps.read-pin.outputs.previous_pin }}
        OPEN_PR: ${{ inputs.open-pr }}
      run: ${{ github.action_path }}/scripts/should-open-pr.sh

    # Stage 6 — build the PR title / body / commit message.
    - name: Compose PR content
      id: descriptions
      if: steps.should-open-pr.outputs.yes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEW_PIN: ${{ steps.parse.outputs.new_pin }}
        PREVIOUS_PIN: ${{ steps.read-pin.outputs.previous_pin }}
        DEP_NAME: ${{ inputs.dependency }}
        GIT_URL: ${{ steps.read-pin.outputs.git_url }}
        OUTCOME: ${{ steps.parse.outputs.outcome }}
        CULPRIT: ${{ steps.parse.outputs.culprit_commit }}
      run: ${{ github.action_path }}/scripts/compose-pr-content.sh

    # Stage 7a — check working tree for changes.
    - name: Check for working-tree changes
      id: check-changes
      if: steps.should-open-pr.outputs.yes == 'true'
      shell: bash
      run: ${{ github.action_path }}/scripts/check-changes.sh

    # Stage 7b — commit + force-push.
    - name: Commit and push branch
      if: steps.should-open-pr.outputs.yes == 'true' && steps.check-changes.outputs.no_changes == 'false'
      shell: bash
      env:
        BRANCH: ${{ inputs.pr-branch }}
        COMMIT_MESSAGE: ${{ steps.descriptions.outputs.commit_message }}
      run: ${{ github.action_path }}/scripts/commit-and-push.sh

    # Stage 7c — create or update PR.
    - name: Create or update PR
      id: create-or-update-pr
      if: steps.should-open-pr.outputs.yes == 'true' && steps.check-changes.outputs.no_changes == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.pr-branch }}
        BASE: ${{ inputs.pr-base }}
        TITLE: ${{ steps.descriptions.outputs.pr_title }}
        BODY: ${{ steps.descriptions.outputs.pr_body }}
        LABELS: ${{ inputs.pr-labels }}
        REVIEWERS: ${{ inputs.reviewers }}
      run: ${{ github.action_path }}/scripts/create-or-update-pr.sh

    # Stage 7d — consolidate PR outputs (runs always).
    - name: Resolve outputs
      id: resolve-outputs
      if: always()
      shell: bash
      env:
        SHOULD_OPEN_PR: ${{ steps.should-open-pr.outputs.yes }}
        NO_CHANGES: ${{ steps.check-changes.outputs.no_changes }}
        PR_NUMBER: ${{ steps.create-or-update-pr.outputs.pr_number }}
        PR_URL: ${{ steps.create-or-update-pr.outputs.pr_url }}
        PR_ACTION: ${{ steps.create-or-update-pr.outputs.pr_action }}
      run: ${{ github.action_path }}/scripts/resolve-outputs.sh

    # Stage 8a — job summary.
    - name: Write job summary
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.parse.outputs.outcome }}
        DEP_NAME: ${{ inputs.dependency }}
        CULPRIT: ${{ steps.parse.outputs.culprit_commit }}
        LAST_GOOD: ${{ steps.parse.outputs.last_good_commit }}
        TARGET: ${{ steps.parse.outputs.target_commit }}
        PREV_PIN: ${{ steps.read-pin.outputs.previous_pin }}
        NEW_PIN: ${{ steps.parse.outputs.new_pin }}
        PR_URL: ${{ steps.resolve-outputs.outputs.pr_url }}
        GIT_URL: ${{ steps.read-pin.outputs.git_url }}
        SUMMARY_MD: ${{ steps.parse.outputs.summary_md }}
      run: ${{ github.action_path }}/scripts/write-summary.sh

    # Stage 8b — manage the per-dependency tracking issue.
    - name: Manage tracking issue
      id: issue
      if: inputs.open-issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUTCOME: ${{ steps.parse.outputs.outcome }}
        DEP_NAME: ${{ inputs.dependency }}
        CULPRIT: ${{ steps.parse.outputs.culprit_commit }}
        LAST_GOOD: ${{ steps.parse.outputs.last_good_commit }}
        TARGET: ${{ steps.parse.outputs.target_commit }}
        GIT_URL: ${{ steps.read-pin.outputs.git_url }}
        ISSUE_LABELS: ${{ inputs.issue-labels }}
      run: ${{ github.action_path }}/scripts/manage-issue.sh
